<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0C0F16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96B"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Gold border -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <!-- J -->
  <text x="10" y="46" font-family="Georgia, serif" font-weight="700" font-size="32" fill="url(#gold)" letter-spacing="-1">J</text>
  <!-- T -->
  <text x="32" y="46" font-family="Georgia, serif" font-weight="700" font-size="32" fill="url(#gold)" letter-spacing="-1">T</text>
  <!-- Subtle dot accent -->
  <circle cx="32" cy="54" r="2.5" fill="url(#gold)" opacity="0.5"/>
</svg>
